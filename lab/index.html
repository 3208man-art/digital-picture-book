<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIデジタル絵本ラボ</title>
  <meta name="description" content="タップで動く！遊んで学べるデジタル絵本＆ミニゲーム">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Yomogi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/home.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span class="cloud cloud-a"></span>
    <span class="cloud cloud-b"></span>
    <span class="cloud cloud-c"></span>
  </div>

  <main class="lab">
    <header class="hero">
      <p class="hero-brand">AIデジタル絵本ラボ</p>
      <h1 class="hero-lead">タップで動く！遊んで学べるデジタル絵本＆ミニゲーム</h1>
      <div class="hero-art" aria-hidden="true">
        <svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="70" cy="55" rx="40" ry="20" fill="#fff" opacity="0.75"/>
          <ellipse cx="95" cy="55" rx="26" ry="14" fill="#fff" opacity="0.75"/>
          <ellipse cx="260" cy="40" rx="48" ry="22" fill="#fff" opacity="0.65"/>
          <ellipse cx="290" cy="40" rx="28" ry="14" fill="#fff" opacity="0.65"/>
          <g transform="translate(180 78)">
            <polygon points="0,-36 10,-10 36,-10 15,6 22,30 0,15 -22,30 -15,6 -36,-10 -10,-10" fill="#ffd166" stroke="#f0b429" stroke-width="2.2"/>
            <circle cx="0" cy="0" r="13" fill="#fff6c8"/>
            <circle cx="-4" cy="-1" r="1.5" fill="#2a3340"/>
            <circle cx="4" cy="-1" r="1.5" fill="#2a3340"/>
            <path d="M-4 4 Q0 8 4 4" fill="none" stroke="#2a3340" stroke-width="1.6" stroke-linecap="round"/>
          </g>
          <path d="M0 130 C70 110, 140 140, 200 118 C260 96, 310 120, 360 108 L360 160 L0 160 Z" fill="#6fcf97" opacity="0.85"/>
        </svg>
      </div>
    </header>

    <section class="works" aria-labelledby="works-title">
      <h2 id="works-title" class="works-title">作品一覧</h2>
      <p class="works-lead">すきな 作品を えらんでね</p>

      <div class="works-grid">
        <article class="work-card">
          <div class="work-thumb" aria-hidden="true">
            <svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#9ad7f0"/>
                  <stop offset="100%" stop-color="#fff2b0"/>
                </linearGradient>
                <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#fff8d6"/>
                  <stop offset="100%" stop-color="#ffe08a" stop-opacity="0"/>
                </radialGradient>
              </defs>
              <rect width="320" height="200" fill="url(#skyGrad)"/>
              <circle cx="250" cy="42" r="28" fill="url(#moonGlow)"/>
              <circle cx="250" cy="42" r="15" fill="#fff4b8"/>
              <circle cx="257" cy="37" r="13" fill="#9ad7f0"/>
              <g fill="#fff" opacity="0.9">
                <circle cx="40" cy="30" r="2"/>
                <circle cx="80" cy="50" r="1.5"/>
                <circle cx="120" cy="24" r="2"/>
              </g>
              <path d="M0 155 C60 130, 120 150, 180 135 C240 120, 280 140, 320 125 L320 200 L0 200 Z" fill="#5bbf8a"/>
              <g transform="translate(140 100)">
                <polygon points="0,-26 7,-7 26,-7 11,4 16,22 0,11 -16,22 -11,4 -26,-7 -7,-7" fill="#ffd166" stroke="#f0b429" stroke-width="2"/>
                <circle cx="0" cy="0" r="9" fill="#fff6c8"/>
                <circle cx="-3" cy="-1" r="1.1" fill="#2a3340"/>
                <circle cx="3" cy="-1" r="1.1" fill="#2a3340"/>
                <path d="M-3 3 Q0 5.5 3 3" fill="none" stroke="#2a3340" stroke-width="1.3" stroke-linecap="round"/>
              </g>
            </svg>
          </div>
          <div class="work-body">
            <p class="work-label">デジタル絵本</p>
            <h3 class="work-name">ほしの たび</h3>
            <p class="work-desc">おほしさまの たびが はじまるよ。タップして ページを めくってみよう！</p>
            <a class="work-btn" href="../book/">絵本を読む</a>
          </div>
        </article>

        <article class="work-card is-soon" aria-disabled="true">
          <div class="work-thumb work-thumb-soon" aria-hidden="true">
            <svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
              <rect width="320" height="200" fill="#d7efe8"/>
              <circle cx="100" cy="80" r="28" fill="#ffb08a" opacity="0.55"/>
              <circle cx="210" cy="70" r="36" fill="#ffd166" opacity="0.5"/>
              <circle cx="160" cy="120" r="42" fill="#7ec8e3" opacity="0.45"/>
              <text x="160" y="108" text-anchor="middle" font-family="Yomogi, sans-serif" font-size="28" fill="#5a6574">？</text>
            </svg>
            <span class="soon-badge">準備中</span>
          </div>
          <div class="work-body">
            <p class="work-label">ミニゲーム</p>
            <h3 class="work-name">次回作（準備中）</h3>
            <p class="work-desc">たのしい ミニゲームが とうじょう予定！もうしばらく おまちください。</p>
            <span class="work-btn is-disabled">もうすぐ公開</span>
          </div>
        </article>
      </div>
    </section>

    <footer class="footer">
      <p>AIデジタル絵本ラボ</p>
    </footer>
  </main>
</body>
</html>
